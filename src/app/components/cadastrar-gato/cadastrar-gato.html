<div class="cadastro-container">

  <form [formGroup]="form" (ngSubmit)="cadastrar()">

    <h2>Cadastrar gato</h2>

    <label>
      Nome
      <input
        type="text"
        formControlName="nome"
        placeholder="Digite o nome do gato"
      />
    </label>

    <label>
      Foto (URL)
      <input
        type="text"
        formControlName="foto"
        placeholder="Cole a URL da foto"
      />
    </label>

    <label>
      Cor
      <input
        type="text"
        formControlName="cor"
        placeholder="Ex: Branco, preto e branco..."
      />
    </label>

    <label>
      Sexo

      <select formControlName="sexo">
        <option value="" disabled>
          Selecione o sexo
        </option>

        <option
          *ngFor="let s of sexoOptions"
          [value]="s"
        >
          {{ s === 'MACHO' ? 'Macho' : 'Fêmea' }}
        </option>
      </select>
    </label>

    <label>
      Idade (anos)

      <input
        type="number"
        formControlName="idade"
        min="0"
        placeholder="Ex: 2"
      />
    </label>

    <label>
      Peso (kg)

      <input
        type="number"
        formControlName="peso"
        min="0"
        step="0.1"
        placeholder="Ex: 4.5"
      />
    </label>

    <label>
      Biografia

      <textarea
        formControlName="biografia"
        rows="4"
        placeholder="Conte um pouco sobre o gato..."
      ></textarea>
    </label>

    <label>
      Status (opcional)

      <select formControlName="status">

        <option value="">
          Deixar em branco (DISPONÍVEL)
        </option>

        <option
          *ngFor="let s of statusOptions"
          [value]="s"
        >
          {{ s === 'DISPONIVEL'
              ? 'Disponível'
              : s === 'EM_ADOCAO'
                ? 'Em adoção'
                : s === 'ADOTADO'
                  ? 'Adotado'
                  : 'Transferido'
          }}
        </option>

      </select>
    </label>

    <button
      type="submit"
      [disabled]="enviando"
    >
      {{ enviando ? 'Cadastrando...' : 'Cadastrar' }}
    </button>

    <p
      class="sucesso"
      *ngIf="mensagemSucesso"
    >
      {{ mensagemSucesso }}
    </p>

    <p
      class="erro"
      *ngIf="mensagemErro"
    >
      {{ mensagemErro }}
    </p>

  </form>

</div>
